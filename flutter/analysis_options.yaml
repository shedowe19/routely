include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    invalid_use_of_visible_for_testing_member: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    avoid_print: true
    use_build_context_synchronously: true
