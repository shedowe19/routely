name: Android Build, Sign & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version Name (e.g. 1.2.3)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version Code (optional; empty selects highest consumed code + 1)"
        required: false
        default: ""

# All branches share the release sequence. A running signed release is never cancelled.
concurrency:
  group: routely-signed-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test release guards offline
        run: python3 -m unittest discover -s .github/tests -p 'test_release_guard.py'

      - name: Validate new release and permanently claim monotone version code
        run: |
          RELEASE_METADATA_PATH="$RUNNER_TEMP/routely-release/release-version.json"
          echo "RELEASE_METADATA_PATH=$RELEASE_METADATA_PATH" >> "$GITHUB_ENV"
          python3 .github/scripts/release_guard.py preflight --metadata "$RELEASE_METADATA_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            flutter/android/**/*.gradle.kts
            flutter/android/gradle/wrapper/gradle-wrapper.properties
            flutter/pubspec.lock

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Resolve locked Flutter dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test Flutter release sources
        working-directory: flutter
        run: |
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Test native contracts and build unsigned release
        working-directory: flutter
        run: |
          # Regenerate the release registrar; --no-pub retains debug-only plugins.
          flutter build apk --release --build-name "$RELEASE_VERSION_NAME" --build-number "$RELEASE_VERSION_CODE"
          git diff --exit-code -- pubspec.lock
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: flutter/build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Verify APK signature before preparing publication
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED_RELEASE_FILE"'
        env:
          SIGNED_RELEASE_FILE: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Prepare APK for Release
        run: |
          mv "$SIGNED_RELEASE_FILE" "flutter/build/app/outputs/flutter-apk/routely-v$RELEASE_VERSION_NAME.apk"
          echo "RELEASE_APK_PATH=flutter/build/app/outputs/flutter-apk/routely-v$RELEASE_VERSION_NAME.apk" >> "$GITHUB_ENV"
        env:
          SIGNED_RELEASE_FILE: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Generate Changelog
        run: |
          # Get the last tag if it exists
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            # No tags yet, get all commits
            LOG=$(git log --pretty=format:"* %s (%h)")
          else
            # Commits since last tag
            LOG=$(git log "$LAST_TAG..HEAD" --pretty=format:"* %s (%h)")
          fi

          # A file preserves multiline commit subjects without Actions output delimiters.
          printf '### Changes in this version\n%s\n' "$LOG" > "$RUNNER_TEMP/routely-release-notes.md"

      - name: Recheck version, validate signed APK and reserve commit-bound tag and draft
        id: reserve_release
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 .github/scripts/release_guard.py reserve \
            --metadata "$RELEASE_METADATA_PATH" --apk "$RELEASE_APK_PATH" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --body-file "$RUNNER_TEMP/routely-release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the reserved release after verifying its tag and assets
        if: github.event_name == 'workflow_dispatch'
        # overwrite_files: false — the helper uses create-only asset POSTs;
        # target_commitish is the validated GITHUB_SHA, never a moving branch.
        run: |
          python3 .github/scripts/release_guard.py publish \
            --metadata "$RELEASE_METADATA_PATH" --apk "$RELEASE_APK_PATH" \
            --release-id "$RESERVED_RELEASE_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESERVED_RELEASE_ID: ${{ steps.reserve_release.outputs.release_id }}

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-apk
          path: |
            ${{ env.RELEASE_APK_PATH }}
            ${{ env.RELEASE_METADATA_PATH }}
          if-no-files-found: error
